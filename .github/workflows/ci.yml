# Merge gate (Tier 1) on the shared self-hosted CI pool. GitHub-hosted runners are never used.
# One job, tier1, on one fresh CI-SelfHosted server per run ([self-hosted, ci-8cpu]; a dispatch
# may pick ci-16cpu or ci-32cpu). Its "Checks and tests in parallel" step runs every part at the
# same time through .github/scripts/ci-run.sh (parts runner: .github/scripts/ci-parts.sh): policy,
# docs, actionlint, fmt, clippy, rust-test (cargo nextest, with the real-Redis store tests on a
# private Redis from tests/allowance-redis.sh), npm-ci, then node-test, then vendor,
# and npm-audit. The job summary holds the parts table; a failed part's log is printed in a group.
#
# Triggers and modes:
# - pull_request (ready, not draft): fast mode. Rust tests named slow_* and tests/slow/*.test.mjs
#   are left out. A draft gets no tier1 result ("tier1 (skipped on drafts)"); marking it ready runs it.
# - merge_group: the merge queue tests each PR together with main, full mode.
# - schedule, every 6 hours on main: full mode; when it is not green, report opens one issue
#   (.github/scripts/report-red.sh). No other event runs report.
# - workflow_dispatch: full mode, with the server size as input.
# Pushes to main run nothing: main only ever receives what the queue tested.
# A pull request runs only the parts its changed files need (.github/scripts/changed-scope.sh): a
# documentation-only one runs policy, docs and actionlint, and the summary names the rule that
# skipped each other part. npm-audit runs on PRs that change package files or .github/ and on
# dispatch; the queue and the 6-hour run leave it out, and maestro-nightly audits every night.
# Time rules: a test that runs 90 s fails the run (nextest slow-timeout, node --test-timeout and the
# CI time step); a test over 60 s gets a warning to mark it slow.
# The server's job-started guard refuses forks, pull requests by anyone but the owner and every
# event not listed above, before any step runs.
# Not run here: the Docker stack suites, browser tests, live smoke tests, the credential scan
# (tests/secret-scan.py). Run them locally as ENGINEERING.md "Testing and validation" describes.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "0 */6 * * *" # full run on main, slow tests included
  workflow_dispatch:
    inputs:
      size:
        description: CI server size
        type: choice
        options: [ci-8cpu, ci-16cpu, ci-32cpu]
        default: ci-8cpu

# A PR keeps one run per branch; queue, scheduled and dispatched runs never cancel each other.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Results bind the pull request's own head (the commit that merges), not GitHub's merge commit.
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  tier1:
    name: ${{ github.event.pull_request.draft && 'tier1 (skipped on drafts)' || 'tier1' }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: [self-hosted, "${{ inputs.size || 'ci-8cpu' }}"]
    timeout-minutes: 15
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$RUNNER_TEMP/changed-files"
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" > "$changed"
            mode=fast profile=ci
          else
            : > "$changed"
            mode=full profile=full
          fi
          echo "event=$EVENT head=$HEAD_SHA base=${BASE_SHA:-none} changed files: $(wc -l < "$changed")"
          {
            bash .github/scripts/changed-scope.sh "$EVENT" < "$changed" | awk -F= '{print "SCOPE_" toupper($1) "=" $2}'
            echo "MODE=$mode"
            echo "NEXTEST_PROFILE=$profile"
            echo "CI_EVIDENCE=$RUNNER_TEMP/ev"
          } | tee -a "$GITHUB_ENV"
      - name: Tools
        run: |
          : "${CI_CACHE_DIR:?the runner must set CI_CACHE_DIR}"
          channel=$(sed -nE 's/^channel = "([^"]+)"$/\1/p' rust-toolchain.toml)
          if [ -z "$channel" ] || ! grep -qF "FROM rust:${channel}-" Dockerfile; then
            echo "::error::rust-toolchain.toml channel '$channel' differs from the Dockerfile's rust image; change both together"
            exit 1
          fi
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
          cargo nextest --version
          node --version
          npm --version
          major=$(node -p 'process.versions.node.split(".")[0]')
          if [ "$major" != 24 ]; then
            echo "::error::Node 24 is required, as in the Dockerfile's web stage"
            exit 1
          fi
          if [ "$RUNNER_ARCH" != X64 ]; then
            echo "::error::actionlint is pinned for linux_amd64, not $RUNNER_ARCH"
            exit 1
          fi
          name="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tools="$CI_CACHE_DIR/web-proxy/tools"
          verify() { echo "$ACTIONLINT_SHA256  $1" | sha256sum --check --quiet -; }
          tarball="$tools/$name"
          if ! [ -f "$tarball" ] || ! verify "$tarball"; then
            rm -f "$tarball"
            tarball="$RUNNER_TEMP/$name"
            curl -fsSL --retry 3 -o "$tarball" \
              "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$name"
            verify "$tarball"
            # Copy under a temporary name, then rename, so the cache never holds a partial file.
            mkdir -p "$tools"
            cp "$tarball" "$tools/.$name.$$"
            mv -f "$tools/.$name.$$" "$tools/$name"
          fi
          tar -xzf "$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
          echo "ACTIONLINT=$RUNNER_TEMP/actionlint" >> "$GITHUB_ENV"
      - name: Checks and tests in parallel
        id: parts
        env:
          EVENT: ${{ github.event_name }}
        run: |
          mkdir -p "$CI_EVIDENCE"
          date +%s > "$CI_EVIDENCE/step-start"
          bash .github/scripts/ci-run.sh
      - name: CI time
        id: timing
        if: always() && steps.parts.outcome != 'skipped' && (env.SCOPE_RUST == 'true' || env.SCOPE_NODE == 'true')
        run: |
          # The JUnit files of the test parts that ran; a part that did not run has no .rc file.
          junit=()
          if [ -e "$CI_EVIDENCE/parts/rust-test.rc" ]; then
            junit+=("target/nextest/$NEXTEST_PROFILE/junit.xml")
          fi
          if [ -e "$CI_EVIDENCE/parts/node-test.rc" ]; then
            junit+=("$CI_EVIDENCE/node-junit.xml")
          fi
          if [ "${#junit[@]}" -eq 0 ]; then
            echo "no test part ran"
            exit 0
          fi
          python3 .github/scripts/ci-timing.py --start "$CI_EVIDENCE/step-start" \
            --out "$CI_EVIDENCE/timing.json" --title "Test times ($MODE)" "${junit[@]}"
      # timing.json, the JUnit files and every part's log.
      - name: Upload ci-timing
        if: always() && steps.timing.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-timing
          retention-days: 90
          path: |
            ${{ runner.temp }}/ev/timing.json
            ${{ runner.temp }}/ev/node-junit.xml
            ${{ runner.temp }}/ev/parts/*.log
            target/nextest/*/junit.xml

  report:
    needs: tier1
    if: always() && github.event_name == 'schedule' && needs.tier1.result != 'success'
    runs-on: [self-hosted, ci-2cpu]
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open the red-run issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_VERSION: 2.103.3
          GH_SHA256: 4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d
        run: |
          # The runner image has jq but no gh, which report-red.sh needs.
          name="gh_${GH_VERSION}_linux_amd64"
          path=$(bash .github/scripts/install-tool.sh gh "$GH_VERSION" "$GH_SHA256" \
            "https://github.com/cli/cli/releases/download/v$GH_VERSION/$name.tar.gz" "$name/bin/gh")
          PATH="$(dirname "$path"):$PATH"
          gh --version
          bash .github/scripts/report-red.sh "Scheduled full CI run failed on main"
