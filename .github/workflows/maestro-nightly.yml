# Maestro nightly: known-vulnerable dependencies. A failure becomes an issue; it never blocks PRs.
# maestro-init writes this file only when it is missing: once a project adapts it, it is the project's.
# The full test suite runs nightly through the project's own CI workflow (`schedule:` trigger).
#
# Jobs:
# - audit: cargo audit of Cargo.lock with a pinned, checksum-verified cargo-audit release, then
#   npm audit of package-lock.json at level high. npm audit runs even when cargo audit failed; the
#   job fails if either did.
# - report: on a scheduled run whose audit did not pass, opens one issue (.github/scripts/report-red.sh)
#   unless one with the same title is already open. It brings a pinned gh, which the runner lacks.
# Pinned tools are verified and cached on the runner by .github/scripts/install-tool.sh under
# $CI_CACHE_DIR/web-proxy/tools/<name>-<version>.
name: maestro-nightly
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_AUDIT_VERSION: 0.22.2
  # SHA-256 of cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz from the rustsec/rustsec release.
  CARGO_AUDIT_SHA256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
  GH_VERSION: 2.103.3
  # SHA-256 of gh_2.103.3_linux_amd64.tar.gz from the cli/cli release.
  GH_SHA256: 4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d
jobs:
  audit:
    runs-on: [self-hosted, ci-8cpu]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-audit
        run: |
          name="cargo-audit-x86_64-unknown-linux-musl-v$CARGO_AUDIT_VERSION"
          path=$(bash .github/scripts/install-tool.sh cargo-audit "$CARGO_AUDIT_VERSION" "$CARGO_AUDIT_SHA256" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v$CARGO_AUDIT_VERSION/$name.tgz" \
            "$name/cargo-audit")
          echo "CARGO_AUDIT=$path" >> "$GITHUB_ENV"
          "$path" --version
      - name: cargo audit
        run: |
          "$CARGO_AUDIT" audit
      - name: npm audit
        if: ${{ !cancelled() }}
        run: |
          npm --version
          npm audit --audit-level=high --package-lock-only

  report:
    needs: audit
    if: always() && github.event_name == 'schedule' && needs.audit.result != 'success'
    runs-on: [self-hosted, ci-2cpu]
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The runner image has jq but no gh, which report-red.sh needs.
          name="gh_${GH_VERSION}_linux_amd64"
          path=$(bash .github/scripts/install-tool.sh gh "$GH_VERSION" "$GH_SHA256" \
            "https://github.com/cli/cli/releases/download/v$GH_VERSION/$name.tar.gz" "$name/bin/gh")
          PATH="$(dirname "$path"):$PATH"
          gh --version
          bash .github/scripts/report-red.sh "Nightly dependency audit failed on main"
