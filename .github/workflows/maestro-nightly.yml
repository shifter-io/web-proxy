# Maestro nightly: known-vulnerable dependencies. A failure becomes an issue; it never blocks PRs.
# maestro-init writes this file only when it is missing: once a project adapts it, it is the project's.
# The full test suite runs nightly through the project's own CI workflow (`schedule:` trigger).
#
# Jobs:
# - audit: cargo audit of Cargo.lock with a pinned, checksum-verified cargo-audit release, then
#   npm audit of package-lock.json at level high. npm audit runs even when cargo audit failed; the
#   job fails if either did. The cargo-audit download is cached on the runner under
#   $CI_CACHE_DIR/web-proxy/tools/cargo-audit-<version>.
# - report: on a scheduled run whose audit did not pass, opens one issue (.github/scripts/report-red.sh)
#   unless one with the same title is already open.
name: maestro-nightly
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_AUDIT_VERSION: 0.22.2
  # SHA-256 of cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz from the rustsec/rustsec release.
  CARGO_AUDIT_SHA256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
jobs:
  audit:
    runs-on: [self-hosted, ci-8cpu]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-audit
        run: |
          : "${CI_CACHE_DIR:?the runner must set CI_CACHE_DIR}"
          if [ "$RUNNER_ARCH" != X64 ]; then
            echo "::error::cargo-audit is pinned for x86_64 Linux, not $RUNNER_ARCH"
            exit 1
          fi
          tools="$CI_CACHE_DIR/web-proxy/tools"
          dest="$tools/cargo-audit-$CARGO_AUDIT_VERSION"
          if ! [ -e "$dest/.complete" ]; then
            rm -rf "$dest"
            name="cargo-audit-x86_64-unknown-linux-musl-v$CARGO_AUDIT_VERSION"
            mkdir -p "$tools"
            tmp=$(mktemp -d "$tools/.tmp.XXXXXX")
            trap 'rm -rf "$tmp"' EXIT
            curl -fsSL --retry 3 -o "$tmp/$name.tgz" \
              "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v$CARGO_AUDIT_VERSION/$name.tgz"
            echo "$CARGO_AUDIT_SHA256  $tmp/$name.tgz" | sha256sum --check --quiet -
            mkdir "$tmp/x"
            tar -xzf "$tmp/$name.tgz" -C "$tmp/x" --strip-components=1 "$name/cargo-audit"
            touch "$tmp/x/.complete"
            # Rename into place, so the cache never holds a partial folder; a parallel run may win.
            mv -T "$tmp/x" "$dest" 2>/dev/null || [ -e "$dest/.complete" ]
          fi
          echo "CARGO_AUDIT=$dest/cargo-audit" >> "$GITHUB_ENV"
          "$dest/cargo-audit" --version
      - name: cargo audit
        run: |
          "$CARGO_AUDIT" audit
      - name: npm audit
        if: ${{ !cancelled() }}
        run: |
          npm --version
          npm audit --audit-level=high --package-lock-only

  report:
    needs: audit
    if: always() && github.event_name == 'schedule' && needs.audit.result != 'success'
    runs-on: [self-hosted, ci-2cpu]
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/report-red.sh "Nightly dependency audit failed on main"
