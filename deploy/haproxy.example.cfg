# Portable example. Generate an ignored local copy with scripts/configure.sh.
global
    maxconn 12000
    # No request/URL logging: WebSocket query strings contain single-use tickets.
defaults
    mode tcp
    timeout connect 2s
    timeout client 11m
    timeout server 11m
    timeout check 1s
resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s
frontend control
    bind :8080
    default_backend control_api
backend control_api
    server api api:3000 check resolvers docker init-addr libc,none
frontend runtime
    bind :8081
    default_backend gateways
backend gateways
    balance leastconn
    option redispatch
    retries 2
    option httpchk GET /health
    http-check expect status 200
    server gateway-a gateway-a:3000 check inter 1s fall 2 rise 2 resolvers docker init-addr libc,none
    server gateway-b gateway-b:3000 check inter 1s fall 2 rise 2 resolvers docker init-addr libc,none
