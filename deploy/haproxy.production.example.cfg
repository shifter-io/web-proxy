# TLS terminates here; backends are reachable only on the private ingress network.
# RUNTIME_HOST is the public gateway host. The control page lives on the original site.
global
    maxconn 12000
    ssl-default-bind-options ssl-min-ver TLSv1.2
    # No URL/access logging: Wisp paths contain single-use connection tickets.

defaults
    mode http
    timeout connect 2s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout tunnel 11m
    timeout check 1s

resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s

frontend http_redirect
    bind :8080
    acl runtime hdr(host) -i "${RUNTIME_HOST}" "${RUNTIME_HOST}:80"
    http-request deny deny_status 421 if !runtime
    http-request redirect prefix "https://${RUNTIME_HOST}" code 308 if runtime

frontend https
    bind :8443 ssl crt /run/tls/ strict-sni alpn http/1.1
    acl runtime hdr(host) -i "${RUNTIME_HOST}" "${RUNTIME_HOST}:443"
    http-request deny deny_status 421 if !runtime
    acl internal_path path -i /health /metrics
    http-request deny if internal_path
    http-request del-header Forwarded
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-For %[src]
    http-response set-header Strict-Transport-Security "max-age=31536000"
    acl api_path path_beg /api/
    use_backend control_api if api_path
    default_backend gateways

backend control_api
    option httpchk GET /health
    http-check expect status 200
    server api api:3000 check resolvers docker init-addr libc,none

backend gateways
    balance leastconn
    option redispatch
    retries 2
    option httpchk GET /health
    http-check expect status 200
    server gateway-a gateway-a:3000 check inter 1s fall 2 rise 2 resolvers docker init-addr libc,none
    server gateway-b gateway-b:3000 check inter 1s fall 2 rise 2 resolvers docker init-addr libc,none
