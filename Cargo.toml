[package]
name = "shifter-web"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
ipnet = "2"
rand = "0.9"
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wisp-mux = { git = "https://github.com/MercuryWorkshop/epoxy-tls", rev = "0c11678d72a636c3a4bc723db87e03e7b888eaf9", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
